name: Build CALMOS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Creer la plateforme Android
        run: flutter create . --platforms=android --org com.calmos --project-name calmos

      - name: Installer les dependances
        run: flutter pub get

      - name: Compiler APK
        run: flutter build apk --release

    - name: Sauvegarder APK
        uses: actions/upload-artifact@v4
        with:
          name: CALMOS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
        
